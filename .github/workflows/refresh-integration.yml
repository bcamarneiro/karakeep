name: Refresh integration branch

# Keeps the personal `local-integration` branch = upstream/main + the two feature
# branches (shortener, instagram) + homelab-config, refreshed against upstream.
# Runs on GitHub's infra, so it does not depend on any laptop being on.
# On a clean merge it force-pushes local-integration; on a conflict it opens a
# single tracking issue and leaves local-integration untouched.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (GitHub cron is always UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-integration
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main + feature branches
        run: |
          git remote add upstream https://github.com/karakeep-app/karakeep.git
          git fetch upstream main --quiet
          git fetch origin resolve-shortened-urls instagram-text-extraction homelab-config local-integration --quiet

      - name: Merge recipe
        id: merge
        run: |
          set -e
          git checkout -B local-integration upstream/main
          for b in resolve-shortened-urls instagram-text-extraction homelab-config; do
            if ! git merge --no-ff -m "merge: $b into local-integration" "origin/$b"; then
              git merge --abort || true
              echo "conflict_branch=$b" >> "$GITHUB_OUTPUT"
              echo "status=conflict" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "status=merged" >> "$GITHUB_OUTPUT"

      - name: Setup (for verification)
        # Reuses the pinned pnpm/Node setup the other CI workflows use, so the
        # verify step below actually has a working `pnpm` on PATH. Runs after
        # the merge step so it installs against the merged tree, not the
        # fork's own main branch. continue-on-error: a broken setup here (e.g.
        # a registry hiccup) must surface as a verify failure below, not skip
        # straight to a green push — see the note on the verify step.
        if: steps.merge.outputs.status != 'conflict'
        continue-on-error: true
        uses: ./tooling/github/setup

      - name: Verify the merged branch still builds and its Instagram tests pass
        if: steps.merge.outputs.status != 'conflict'
        id: verify
        continue-on-error: true
        run: |
          pnpm --filter @karakeep/shared typecheck
          pnpm --filter @karakeep/workers typecheck
          (cd apps/workers && pnpm vitest run workers/crawler/instagram.test.ts workers/crawler/instagramPage.test.ts)

      - name: Push refreshed branch (only if content changed)
        if: steps.merge.outputs.status == 'merged' && steps.verify.outcome != 'failure'
        run: |
          before=$(git rev-parse --verify --quiet "origin/local-integration^{tree}" || echo none)
          after=$(git rev-parse "local-integration^{tree}")
          if [ "$before" = "$after" ]; then
            echo "Up to date — integrated content unchanged; nothing to push."
          else
            git push -f origin local-integration
            echo "Pushed refreshed local-integration ($(git rev-parse --short local-integration))."
          fi

      - name: Open tracking issue on conflict or verification failure
        # Fires on either signal from the merge/verify steps above: a textual
        # merge conflict, or a clean merge that then fails to typecheck or
        # pass the Instagram tests (upstream frequently touches
        # packages/shared/inference.ts, so a clean merge is not proof the
        # build still works).
        if: steps.merge.outputs.status == 'conflict' || steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT_BRANCH: ${{ steps.merge.outputs.status == 'conflict' && steps.merge.outputs.conflict_branch || 'verification' }}
          FAILURE_REASON: ${{ steps.merge.outputs.status == 'conflict' && format('a merge conflict while merging `{0}`', steps.merge.outputs.conflict_branch) || 'a **verification failure** after a clean merge (shared/workers typecheck or the Instagram extractor tests failed against the merged tree — no textual merge conflict)' }}
        run: |
          # Dedupe on the TITLE, not the label: a label filter silently matches
          # nothing when the label is missing, which would reopen a new issue
          # every week. Titles are stable per conflicting branch; the
          # verification-failure case uses the fixed key 'verification' so
          # repeated verify failures also dedupe onto one issue.
          title="Integration refresh: conflict merging '${CONFLICT_BRANCH}'"
          if gh issue list --state open --search "$title in:title" --json title \
               --jq 'any(.title == "'"$title"'")' | grep -q true; then
            echo "A tracking issue for '${CONFLICT_BRANCH}' is already open — not duplicating."
            echo "::error::Integration refresh hit ${FAILURE_REASON} (tracking issue already open)."
            exit 1
          fi

          # Create the issue WITHOUT --label first. Passing a label that does not
          # exist makes `gh issue create` fail outright, and that is exactly how
          # the Aug 2026 conflicts went unreported for three weeks: the label was
          # missing, both this and the `gh label create` above were suppressed
          # with `|| true`, and the only surviving signal was a red run nobody
          # looks at. Labelling is cosmetic; the issue is the notification.
          if ! url=$(gh issue create \
            --title "$title" \
            --body "The weekly refresh of \`local-integration\` (upstream/main + shortener + instagram + homelab-config) hit ${FAILURE_REASON}. \`local-integration\` on the fork was left unchanged, so the homelab keeps running the last good build.

          The usual cause is one of the feature branches drifting far behind upstream — rebase it onto \`upstream/main\` and force-push, which also unblocks its pull request. If this was a verification failure rather than a merge conflict, upstream likely changed something the Instagram extractor (or \`packages/shared/inference.ts\`) depends on — check the failed run's logs for the shared/workers typecheck and Instagram test output. Then re-run this workflow from the Actions tab.

          cc @bcamarneiro"); then
            echo "::error::Hit ${FAILURE_REASON}, AND the tracking issue could not be created. Check the issues:write permission on this workflow."
            exit 1
          fi
          echo "Opened $url"

          # Best-effort labelling: never let it mask the issue we just created.
          gh label create integration-refresh --color BFD4F2 \
            --description "Automated integration refresh" || echo "note: label already exists or could not be created"
          gh issue edit "$url" --add-label integration-refresh || echo "note: could not label $url"

          # Fail the run so the conflict/failure also surfaces in the Actions tab.
          echo "::error::Integration refresh hit ${FAILURE_REASON}. Tracking issue: $url"
          exit 1
